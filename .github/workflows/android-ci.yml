name: DSP4Guitar Android CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Build & Compile Native DSP Engine
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository & Submodules
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0
          lfs: true # Henter faktiske binærfiler i tilfelle jar-filen var en LFS-peker

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK & NDK Environment
        uses: android-actions/setup-android@v3

      # Finn prosjektet, generer ny wrapper på serveren, og gi kjørerettigheter
      - name: Locate Project & Regenerate Corrupt Gradle Wrapper
        run: |
          # Finn mappen der gradlew ligger (eller bruk rotmappen hvis ikke funnet)
          GRADLEW_PATH=$(find . -name "gradlew" | head -n 1)
          if [ -n "$GRADLEW_PATH" ]; then
            GRADLEW_DIR=$(dirname "$GRADLEW_PATH")
            echo "✅ Fant prosjekt i mappen: $GRADLEW_DIR"
            cd "$GRADLEW_DIR"
          else
            echo "⚠️ Fant ikke gradlew, antar at prosjektet ligger i rotmappen."
          fi
          
          # Bruk Ubuntu-serverens innebygde Gradle til å generere en 100% frisk wrapper-jar
          echo "🔧 Genererer en ny og urørt gradle-wrapper.jar på serveren..."
          gradle wrapper --distribution-type all
          
          # Gjør gradlew kjørbart
          chmod +x gradlew
          
          # Lagre mappen som en miljøvariabel for neste steg
          echo "PROJ_DIR=$(pwd)" >> $GITHUB_ENV

      # Bygg C++ DSP motor og Android APK fra riktig mappe
      - name: Build Debug APK (with C++ CMake/NDK compilation)
        run: |
          cd ${{ env.PROJ_DIR }}
          ./gradlew assembleDebug --stacktrace

      # Last opp den ferdige APK-filen under Actions-fanen på GitHub
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dsp4guitar-usb-studio-debug-apk
          path: '**/build/outputs/apk/debug/*.apk'
          retention-days: 30
