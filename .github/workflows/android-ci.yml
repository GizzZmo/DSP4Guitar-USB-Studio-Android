name: DSP4Guitar Android CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Build & Compile Native DSP Engine
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository & Submodules
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK & NDK Environment
        uses: android-actions/setup-android@v3

      # Automatisk finn gradlew og gjør den eksekverbar
      - name: Locate and Grant Execute Permission for Gradlew
        run: |
          GRADLEW_PATH=$(find . -name "gradlew" | head -n 1)
          if [ -z "$GRADLEW_PATH" ]; then
            echo "❌ Feil: Fant ikke gradlew i repoet! Sjekk at du har committet gradlew og gradle/wrapper/-mappen."
            exit 1
          fi
          echo "✅ Fant gradlew i: $GRADLEW_PATH"
          chmod +x "$GRADLEW_PATH"
          echo "GRADLEW_DIR=$(dirname "$GRADLEW_PATH")" >> $GITHUB_ENV

      # Bygg APK fra mappen der gradlew ble funnet
      - name: Build Debug APK (with C++ CMake/NDK compilation)
        run: |
          cd ${{ env.GRADLEW_DIR }}
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dsp4guitar-usb-studio-debug-apk
          path: '**/build/outputs/apk/debug/*.apk'
          retention-days: 30
