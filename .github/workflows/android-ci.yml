name: DSP4Guitar Android CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Build & Compile Native DSP Engine
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository & Submodules
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0
          lfs: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK & NDK Environment
        uses: android-actions/setup-android@v3

      - name: Locate Project & Prepare Build Environment
        run: |
          GRADLEW_PATH=$(find . -name "gradlew" | head -n 1)
          if [ -n "$GRADLEW_PATH" ]; then
            GRADLEW_DIR=$(dirname "$GRADLEW_PATH")
            echo "✅ Fant prosjekt i mappen: $GRADLEW_DIR"
            cd "$GRADLEW_DIR"
          else
            echo "⚠️ Fant ikke gradlew, antar at prosjektet ligger i rotmappen."
          fi
          
          # 1. Opprett miljøfiler og gyldig stub for Google Services
          echo "📝 Oppretter .env og dummy google-services.json for CI..."
          touch .env.example .env
          mkdir -p app/src/debug app
          
          cat << 'EOF' > app/src/debug/google-services.json
          {
            "project_info": {
              "project_number": "1234567890",
              "project_id": "dsp4guitar-dummy",
              "storage_bucket": "dsp4guitar-dummy.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:1234567890:android:1234567890abcdef",
                  "android_client_info": {
                    "package_name": "com.cybergroup.dsp4guitar"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "AIzaSyDummyKeyForCIEnvironmentOnly00"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF
          
          # Kopier også til app/ for å dekke alle oppslagsbaner
          cp app/src/debug/google-services.json app/google-services.json
          
          # 2. Generer debug.keystore
          echo "🔑 Genererer midlertidig debug.keystore..."
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 1000 -dname "CN=Android Debug,O=Android,C=US"
          
          # 3. Generer frisk Gradle-wrapper
          echo "🔧 Genererer ny og urørt gradle-wrapper.jar..."
          gradle wrapper --distribution-type all
          chmod +x gradlew
          
          echo "PROJ_DIR=$(pwd)" >> $GITHUB_ENV

      - name: Build Debug APK (with C++ CMake/NDK compilation)
        run: |
          cd ${{ env.PROJ_DIR }}
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dsp4guitar-usb-studio-debug-apk
          path: '**/build/outputs/apk/debug/*.apk'
          retention-days: 30
